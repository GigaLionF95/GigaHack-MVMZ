<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GigaHack harness (MV + plugins)</title>
  <style>
    html,body{margin:0;padding:0;background:#101010;height:100%;overflow:hidden}
    #GameCanvas{position:absolute;left:0;top:0;
      background:repeating-linear-gradient(135deg,#17181a 0 8px,#1a1b1d 8px 16px)}
  </style>
</head>
<body>
<!-- The engine sets the canvas z-index INLINE (MV rpg_core.js:2489,
     MZ rmmz_core.js:891). It is inline here for the same reason: on MV,
     Graphics._modifyExistingElements zeroes every positive inline z-index in
     the document at boot, and a stylesheet rule would not be a test of it. -->
<canvas id="GameCanvas" width="1280" height="720" style="z-index:1"></canvas>

<!-- RPG Maker MV 1.6.1 plus a modelled third-party plugin stack.
     Load order is core -> engine -> [plugins] -> fixtures -> the 35 modules,
     and it is spelled out here rather than implied by one file's line numbers. -->
<script src="stubs/core.js"></script>
<script src="stubs/x-misc.js"></script>
